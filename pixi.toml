[project]
name = "frequency-analysis"
version = "0.1.0"
description = "Frequency Analysis of Neural Networks"
authors = ["Mithilesh R"]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.9,<3.13"
pytorch = ">=2.0"
torchvision = "*"
numpy = "*"
matplotlib = "*"
pillow = "*"
tqdm = "*"
timm = "*"
huggingface_hub = "*"
jupyter = "*"
ipykernel = "*"

[tasks]
notebook = "jupyter notebook FrequencyAnalysis.ipynb"
lab = "jupyter lab"

[feature.cuda.target.linux-64.dependencies]
pytorch-cuda = ">=11.8"

[environments]
default = {features = ["cuda"], solve-group = "default"}
cpu = {features = [], solve-group = "default"}
