[project]
name = "frequency-analysis"
version = "0.1.0"
description = "Frequency Analysis of Neural Networks"
authors = ["Mithilesh R"]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.9,<3.13"
pytorch = {version = ">=2.0", channel = "pytorch"}
torchvision = {version = "*", channel = "pytorch"}
numpy = "*"
matplotlib = "*"
pillow = "*"
tqdm = "*"
timm = "*"
datasets = "*"
huggingface_hub = "*"
jupyter = "*"
ipykernel = "*"

[target.linux-64.dependencies]
pytorch-cuda = {version = "11.8", channel = "pytorch"}

[tasks]
notebook = "jupyter notebook FrequencyAnalysis.ipynb"
lab = "jupyter lab"
check-gpu = "python check_gpu.py"

[environments]
default = {solve-group = "default"}
